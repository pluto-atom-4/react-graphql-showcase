packages:
  - 'frontend'
  - 'backend-graphql'
  - 'backend-express'
  - 'packages/*'
allowBuilds:
  '@apollo/protobufjs': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

catalog:
  # Core dependencies with versions from version-conflict-free-stack.md
  '@apollo/client': '4.x'
  '@apollo/client-nextjs': '^0.10.0'
  apollo-server: '4.x'
  express: '4.21.1'
  next: '16.x'
  react: '19.x'
  react-dom: '19.x'
  typescript: '5.x'
  vitest: '^2.x'
