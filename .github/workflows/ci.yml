name: CI Pipeline

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # Phase 1: Isolate Prisma generation (must complete before type-check)
  prisma-generate:
    name: Prisma Generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend-graphql exec prisma generate
      - name: Upload Prisma Client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prisma-client
          path: node_modules/.pnpm/@prisma+client*/node_modules/@prisma/client/
          retention-days: 1

  # Phase 2: Type checking (depends on prisma-generate, uses --incremental false for TS 7 cache clarity)
  type-check:
    name: Type Check
    needs: prisma-generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend-graphql exec prisma generate
      - run: pnpm type-check --incremental false

  # Phase 3: Unit & Integration Tests
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --run

  # Phase 4: Build all packages
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: |
            backend-graphql/dist/
            backend-express/dist/
            frontend/.next/
          retention-days: 1

  # Phase 5: Backend Linting (backends only; frontend follows #367)
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend-graphql run lint
      - run: pnpm --filter backend-express run lint

  # Phase 6: Frontend Linting (non-blocking until warnings resolved per #367)
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend run lint --max-warnings=0

  # Phase 7: Smoke Tests (validates backends boot and ESM imports work)
  smoke-test:
    name: Smoke Test
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [backend-graphql, backend-express]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
      - name: Test ${{ matrix.backend }} boot
        working-directory: ${{ matrix.backend }}
        timeout-minutes: 1
        run: |
          # Attempt to require/import the built entry point to validate ESM imports
          # (Full server start requires database; this validates module loading)
          node --input-type=module --eval "
            import('./dist/index.js').then(
              () => { console.log('✓ ${{ matrix.backend }} modules loaded successfully'); process.exit(0); },
              (err) => { console.error('✗ Failed to load ${{ matrix.backend }} modules:', err.message); process.exit(1); }
            );
          "

  # Phase 8: Final CI Status (depends on all mandatory gates; frontend-lint is non-blocking)
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [prisma-generate, type-check, test, build, backend-lint, frontend-lint, smoke-test]
    if: always()
    steps:
      - name: Check CI Results
        run: |
          # Frontend lint is non-blocking (continue-on-error: true) until warnings are resolved per #367
          if [[ "${{ needs.prisma-generate.result }}" != "success" || \
                "${{ needs.type-check.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" || \
                "${{ needs.build.result }}" != "success" || \
                "${{ needs.backend-lint.result }}" != "success" || \
                "${{ needs.smoke-test.result }}" != "success" ]]; then
            echo "❌ CI Pipeline Failed (mandatory gates)"
            exit 1
          fi
          if [[ "${{ needs.frontend-lint.result }}" != "success" ]]; then
            echo "⚠️  Frontend lint warnings detected (non-blocking)"
          fi
          echo "✅ CI Pipeline Passed"
